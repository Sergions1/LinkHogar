spring.application.name=LinkHogar
server.port=8081
logging.level.org.springframework.security=DEBUG

# Ciclo de vida de docker
spring.docker.compose.lifecycle-management=start_and_stop
spring.docker.compose.stop.command=down

# Conexion a la base de datos docker
spring.datasource.url=jdbc:mysql://localhost:3307/linkhogar_bd?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=usuario_dev
spring.datasource.password=password_dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (ORM)
#Hibernate solo verificará que las tablas coinciden con las clases Java. # NO creará tablas automáticamente. De eso se encargará Flyway.
spring.jpa.hibernate.ddl-auto=update
#Usado para la visión de consultas sql por consola (Desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (Migraciones)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

