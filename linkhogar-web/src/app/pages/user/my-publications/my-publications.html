<div class="p-3 bg-secundario" style="min-height: 100vh;">

  <div class="row my-5 text-center">
    <div class="col-12 col-md-8 mx-auto">
      <h2 class="fw-bold text-primario mb-2">Mis Publicaciones</h2>
      <p class="text-muted">Gestiona los anuncios de las viviendas que has publicado.</p>
    </div>
  </div>

  <div class="d-flex col gap-3">
    <section id="listado" class="w-100 rounded-3">
      <div class="card shadow-sm border-0 rounded-4 bg-segundario h-100 px-4" id="seccionPisos">
        <div class="row g-4 pt-3">

          @if (!isLoading() && houses()?.totalElements === 0) {
            <div class="col-12 text-center py-5">
              <i class="bi bi-house-add text-muted" style="font-size: 3rem;"></i>
              <h4 class="mt-3 text-muted">Aún no tienes publicaciones</h4>
              <p class="text-muted mb-4">Anímate a publicar tu primera vivienda con nosotros.</p>
              <a class="btn primary-btn px-4" href="/create-house">Publicar ahora</a>
            </div>
          } @else {
            <app-entity-card-view
              [pageData]="houses()"
              [isLoading]="isLoading()"
              [cardTemplate]="houseCard"
              (pageChange)="onPageChange($event)"
              headerMessage="Hogar publicado"
              headerMessagePlural="Hogares publicados">
            </app-entity-card-view>
          }

        </div>
      </div>
    </section>
  </div>
</div>

<ng-template #houseCard let-house>
  <house-card [house]="house"
              [isMyPublications]="true"
              (edit)="onEditPublication($event)"
              (delete)="onDeletePublication($event)"
              (manageMembers)="onManageMembers($event)"/>
</ng-template>

@if (selectedHouseId()) {
  <app-manage-members-modal
    [homeId]="selectedHouseId()!"
    (close)="closeMembersModal()">
  </app-manage-members-modal>
}
