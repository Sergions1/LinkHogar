<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-5">

          <div class="d-flex flex-column align-items-center text-center mb-4">
            <div class="avatar-container mb-3">
              @if (currentUser()?.avatarUrl) {
                <img [src]="currentUser()?.avatarUrl"
                     class="rounded-circle border shadow-sm"
                     style="width: 120px; height: 120px; object-fit: cover;"
                     alt="Avatar">
              }
              @else {
                <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-primario border shadow-sm mx-auto"
                     style="width: 120px; height: 120px; background: #f8f9fa; font-size: 2.5rem;">
                  {{ currentUser()?.firstName?.charAt(0)?.toUpperCase() }}{{ currentUser()?.lastName?.charAt(0)?.toUpperCase() }}
                </div>
              }
            </div>
            <button class="btn btn-outline-primary btn-sm rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#avatarModal">
              Cambiar foto
            </button>
            <h4 class="mt-3 mb-0">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</h4>
            <p class="text-muted">{{ currentUser()?.mail }}</p>
          </div>

          <form [formGroup]="profileForm" (ngSubmit)="guardarCambios()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted small text-uppercase">Nombre</label>
                <input type="text" class="form-control bg-light" formControlName="firstName" [readonly]="!isEditing">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small text-uppercase">Apellidos</label>
                <input type="text" class="form-control bg-light" formControlName="lastName" [readonly]="!isEditing">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small text-uppercase">Teléfono</label>
                <input type="tel" class="form-control bg-light" formControlName="phone" [readonly]="!isEditing">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small text-uppercase">Fecha de Nacimiento</label>
                <input type="date" class="form-control bg-light" formControlName="fechaNac" [readonly]="!isEditing">
              </div>
            </div>

            <div class="d-flex justify-content-end mt-4 pt-3 border-top">
              @if (!isEditing) {
                <button type="button" class="btn btn-primary px-4" (click)="toggleEdit()">Editar Perfil</button>
              }
              @else {
                <button type="button" class="btn btn-secondary px-4 me-2" (click)="toggleEdit()">Cancelar</button>
                <button type="submit" class="btn btn-success px-4" [disabled]="profileForm.invalid">Guardar Cambios</button>
              }
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
