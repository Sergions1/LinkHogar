<!-- not-found.html -->
<div class="min-vh-100 bg-fondo-principal d-flex flex-column align-items-center justify-content-center text-center px-4">

  <!-- Número 404 -->
  <div class="fw-bold mb-3"
       style="font-size: 8rem; line-height: 1; color: var(--color-primario); opacity: 0.15;">
    404
  </div>

  <!-- Icono -->
  <div class="mb-4" style="margin-top: -60px;">
    <i class="bi bi-house-slash" style="font-size: 5rem; color: var(--color-primario);"></i>
  </div>

  <!-- Mensaje -->
  <h1 class="fw-bold mb-2" style="color: var(--color-texto);">Página no encontrada</h1>
  <p class="text-muted mb-5" style="max-width: 420px;">
    Lo sentimos, la página que buscas no existe o ha sido movida.
    Vuelve al inicio y sigue explorando.
  </p>

  <!-- Botones -->
  <div class="d-flex gap-3 flex-wrap justify-content-center">
    <a routerLink="/" class="btn primary-btn px-4 fw-semibold">
      <i class="bi bi-house me-2"></i>Volver al inicio
    </a>
    <a routerLink="/explore" class="btn btn-outline-secondary px-4 fw-semibold">
      <i class="bi bi-search me-2"></i>Explorar viviendas
    </a>
  </div>

</div>
