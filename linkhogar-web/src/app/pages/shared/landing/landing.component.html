<div class="d-flex justify-content-center py-3 row">
  <div id="mainBuscador" class="d-flex col-10 justify-content-center">
    <div id="foto" class="w-100 h-100 rounded-3" [style.background-image]="'url('+ getBackgroundUrl()+')'">
      <h1>Encuentra tu próximo hogar</h1>
      <h2>El alquiler perfecto te espera. Comienza tu búsqueda a continuación.</h2>

      <div class="mt-4 col-md-8 col-lg-6">
        <div class="input-group mb-3">
          <input type="text"
                 class="form-control"
                 placeholder="Busca por ciudad..."
                 [value]="searchQuery()"
                 (input)="onInput($event)"
                 (keyup.enter)="search()">
          <button class="btn primary-btn"
                  (click)="search()"
                  [disabled]="!searchQuery().trim()">
            <i class="bi bi-search me-1"></i> Buscar
          </button>
        </div>
      </div>

    </div>
  </div>

  <div id="pisosRecientes" class="d-flex col-10 justify-content-center mt-5 pb-5 row">
    <div class="row">

    </div>
  </div>
</div>
