<!-- steps/type-step/type-step.html -->
<div>
  <h4 class="fw-bold mb-1">What type of property is it?</h4>
  <p class="text-muted mb-4">Select the option that best describes your property.</p>

  <div class="row g-3">
    @for (type of types; track type.value) {
      <div class="col-6 col-md-4">
        <div class="card border-2 rounded-4 text-center py-4 px-2 h-100"
             style="cursor: pointer; transition: all 0.15s ease;"
             [class.border-primario]="selected() === type.value"
             [class.bg-primario]="selected() === type.value"
             [class.text-white]="selected() === type.value"
             [class.shadow-sm]="selected() === type.value"
             [class.border-light]="selected() !== type.value"
             (click)="select(type.value)">
          <i class="bi {{ type.icon }} fs-1 mb-2 d-block"></i>
          <span class="fw-semibold">{{ type.label }}</span>
        </div>
      </div>
    }
  </div>
</div>
