<div>
  <h4 class="fw-bold mb-1">Características</h4>
  <p class="text-muted mb-4">Introduce las características y comodidades de tu propiedad.</p>

  <div class="mb-4 p-3 bg-fondo-secundario rounded-4 border-0">
    <label class="form-label fw-semibold mb-3">Modo de alquiler <span class="text-danger">*</span></label>
    <div class="d-flex gap-3">
      <div class="flex-fill">
        <input type="radio" class="btn-check" id="modeEntire" name="rentalMode"
               [checked]="mode() === 'COMPLETE'"
               (change)="updateMode('COMPLETE')">
        <label class="btn w-100 py-3 rounded-4"
               [class.primary-btn]="mode() === 'COMPLETE'"
               [class.text-white]="mode() === 'COMPLETE'"
               [class.btn-outline-acento]="mode() !== 'COMPLETE'"
               for="modeEntire">
          <i class="bi bi-house-door d-block fs-3 mb-1"></i> {{ 'COMPLETE' | rentalMode }}
        </label>
      </div>
      <div class="flex-fill">
        <input type="radio" class="btn-check" id="modeRooms" name="rentalMode"
               [checked]="mode() === 'BY_ROOM'"
               (change)="updateMode('BY_ROOM')">
        <label class="btn w-100 py-3 rounded-4"
               [class.primary-btn]="mode() === 'BY_ROOM'"
               [class.text-white]="mode() === 'BY_ROOM'"
               [class.btn-outline-acento]="mode() !== 'BY_ROOM'"
               for="modeRooms">
          <i class="bi bi-door-closed d-block fs-3 mb-1"></i> {{ 'BY_ROOM' | rentalMode }}
        </label>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <label class="form-label fw-semibold">
        Tamaño (m²) <span class="text-danger">*</span>
      </label>
      <div class="input-group">
        <input type="number"
               class="form-control"
               placeholder="85"
               min="1"
               [value]="form().size ?? ''"
               (input)="updateNumber('size', $any($event.target).value)">
        <span class="input-group-text">m²</span>
      </div>
    </div>

    <div class="col-md-4">
      <label class="form-label fw-semibold">
        Habitaciones <span class="text-danger">*</span>
      </label>
      <div class="input-group">
        <input type="number"
               class="form-control"
               placeholder="2"
               min="1"
               [value]="form().rooms ?? ''"
               (input)="updateNumber('rooms', $any($event.target).value)">
        <span class="input-group-text"><i class="bi bi-door-closed"></i></span>
      </div>
    </div>

    <div class="col-md-4">
      <label class="form-label fw-semibold">
        Baños <span class="text-danger">*</span>
      </label>
      <div class="input-group">
        <input type="number"
               class="form-control"
               placeholder="1"
               min="1"
               [value]="form().baths ?? ''"
               (input)="updateNumber('baths', $any($event.target).value)">
        <span class="input-group-text"><i class="bi bi-droplet-fill"></i></span>
      </div>
    </div>
  </div>

  <label class="form-label fw-semibold mb-3">Comodidades</label>
  <div class="row g-2">
    @for (toggle of toggles; track toggle.key) {
      <div class="col-6 col-md-3">
        <div class="card border-2 rounded-4 text-center py-3 px-2 h-100"
             style="cursor: pointer; transition: all 0.15s ease;"
             [class.bg-primario]="form()[toggle.key]"
             [class.text-white]="form()[toggle.key]"
             [class.border-primario]="form()[toggle.key]"
             [class.border-light]="!form()[toggle.key]"
             [class.text-muted]="!form()[toggle.key]"
             (click)="toggleFeature(toggle.key)">
          <i class="bi {{ toggle.icon }} fs-4 mb-1 d-block"></i>
          <span class="small fw-semibold">{{ toggle.label }}</span>
        </div>
      </div>
    }
  </div>

</div>
