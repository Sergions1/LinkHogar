<!-- steps/ubication-step/ubication-step.html -->
<div>
  <h4 class="fw-bold mb-1">¿Dónde está la propiedad?</h4>
  <p class="text-muted mb-4">Introduzca la dirección completa. Comprobaremos si existe</p>

  <div class="row g-3">

    <!-- Street -->
    <div class="col-md-8">
      <label class="form-label fw-semibold">Calle <span class="text-danger">*</span></label>
      <input type="text"
             class="form-control"
             placeholder="e.g. Gran Vía"
             [value]="form().street"
             (input)="update('street', $any($event.target).value)">
    </div>

    <!-- Number -->
    <div class="col-md-4">
      <label class="form-label fw-semibold">Número <span class="text-danger">*</span></label>
      <input type="text"
             class="form-control"
             placeholder="e.g. 24"
             [value]="form().number"
             (input)="update('number', $any($event.target).value)">
    </div>

    <!-- Floor -->
    <div class="col-md-6">
      <label class="form-label fw-semibold">Piso</label>
      <input type="text"
             class="form-control"
             placeholder="e.g. 3"
             [value]="form().floor ?? ''"
             (input)="update('floor', $any($event.target).value)">
    </div>

    <!-- Door -->
    <div class="col-md-6">
      <label class="form-label fw-semibold">Puerta</label>
      <input type="text"
             class="form-control"
             placeholder="e.g. A"
             [value]="form().door ?? ''"
             (input)="update('door', $any($event.target).value)">
    </div>

    <!-- Zip code -->
    <div class="col-md-4">
      <label class="form-label fw-semibold">Código Postal <span class="text-danger">*</span></label>
      <input type="text"
             class="form-control"
             placeholder="e.g. 28013"
             maxlength="5"
             [value]="form().cp"
             (input)="update('cp', $any($event.target).value)">
    </div>

    <!-- City -->
    <div class="col-md-4">
      <label class="form-label fw-semibold">Ciudad <span class="text-danger">*</span></label>
      <input type="text"
             class="form-control"
             placeholder="e.g. Madrid"
             [value]="form().city"
             (input)="update('city', $any($event.target).value)">
    </div>

    <!-- Province -->
    <div class="col-md-4">
      <label class="form-label fw-semibold">Provincia</label>
      <input type="text"
             class="form-control"
             placeholder="e.g. Madrid"
             [value]="form().province"
             (input)="update('province', $any($event.target).value)">
    </div>

  </div>

  <!-- Validation status -->
  <div class="mt-4">
    @if (isValidating()) {
      <div class="d-flex align-items-center gap-2 mt-2 text-muted small">
        <div class="spinner-border spinner-border-sm"></div>
        Validando dirección...
      </div>
    }

    @if (foundAddress()) {
      <div class="alert alert-success border-0 rounded-3 small mt-2 py-2">
        <i class="bi bi-check-circle me-2"></i>
        {{ foundAddress() }}
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert-danger border-0 rounded-3 small mt-2 py-2">
        <i class="bi bi-exclamation-circle me-2"></i>
        {{ errorMessage() }}
      </div>
    }
  </div>

</div>
