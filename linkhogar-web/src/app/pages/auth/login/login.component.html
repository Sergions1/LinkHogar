<div class="container d-flex justify-content-center align-items-center vh-100 bg">

  <div class="col-12 col-md-8 col-lg-5 col-xl-4">

    <div class="text-center mb-4">
      <h1 class="h2 text-oscuro">Inicia sesión</h1>
      <p class="text-muted">Bienvenido de vuelta. Entra en tu cuenta.</p>
    </div>

  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4 p-md-5">


      <form (ngSubmit)="onSubmit()">

        <div class="mb-3 text-start">
          <label for="mail" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="mail"
            [(ngModel)]="loginData.mail"
            name="mail"
            placeholder="nombre@ejemplo.com"
            required>
          <div id="errorMail"></div>
        </div>

        <div class="mb-3 text-start">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            [(ngModel)]="loginData.password"
            name="password"
            required>
          <div id="errorPwd"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>

      </form>
    </div>
  </div>
</div>
</div>
