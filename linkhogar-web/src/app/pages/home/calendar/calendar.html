<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold text-primary mb-0">Calendario del Hogar</h4>
    <button class="btn primary-btn rounded-pill px-4 shadow-sm" (click)="handleDateClick({})">
      <i class="bi bi-plus-lg me-2"></i> Añadir Evento
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <full-calendar [options]="calendarOptions()"></full-calendar>
    </div>
  </div>
</div>

@if (showViewModal() && selectedEvent()) {
  <app-view-event-modal
    [event]="selectedEvent()!"
    (close)="showViewModal.set(false)"
    (edit)="openEditModal($event)">
  </app-view-event-modal>
}

@if (showCreateModal()) {
  <app-create-event-modal
    [homeId]="homeId!"
    [myUserId]="myUserId!"
    [myUserName]="myUserName!"
    [initialDate]="selectedDate()"
    [eventToEdit]="eventToEdit()"
    (close)="closeCreateModal()"
    (eventCreated)="onEventCreated()">
  </app-create-event-modal>
}
