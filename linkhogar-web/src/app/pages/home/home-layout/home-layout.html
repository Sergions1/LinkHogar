<div class="admin-container d-flex">

  <div class="sidebar bg-acento p-3 shadow-sm" [class.collapsed]="isCollapsed">
    <div class="d-flex align-items-center mb-4"
         [class.justify-content-between]="!isCollapsed"
         [class.justify-content-center]="isCollapsed">
      @if (!isCollapsed) {
        <h5 class="m-0 text-accent font-weight-bold">Mi hogar</h5>
      }
      <button class="btn border-0 btn-sm" (click)="toggleSidebar()">
        @if (isCollapsed) {
          <i class="bi bi-arrow-right-circle-fill text-light fs-5"></i>
        } @else {
          <i class="bi bi-arrow-left-circle-fill text-light fs-5"></i>
        }
      </button>
    </div>

    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item mb-2">
        <a routerLink="/hogar/dashboard" routerLinkActive="active" class="nav-link text-black">
          <span class="me-2"><i class="bi bi-info-square-fill text-light"></i></span>
          @if (!isCollapsed) { <span>Dashboard</span> }
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/hogar/tareas" routerLinkActive="active" class="nav-link text-black">
          <span class="me-2"><i class="bi bi-houses-fill text-light"></i></span>
          @if (!isCollapsed) { <span>Tareas</span> }
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/hogar/agenda" routerLinkActive="active" class="nav-link text-black">
          <span class="me-2"><i class="bi bi-gear-fill text-light"></i></span>
          @if (!isCollapsed) { <span>Agenda</span> }
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/hogar/gastos" routerLinkActive="active" class="nav-link text-black">
          <span class="me-2"><i class="bi bi-gear-fill text-light"></i></span>
          @if (!isCollapsed) { <span>Gastos</span> }
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/hogar/chat" routerLinkActive="active" class="nav-link text-black">
          <span class="me-2"><i class="bi bi-gear-fill text-light"></i></span>
          @if (!isCollapsed) { <span>Chat</span> }
        </a>
      </li>
    </ul>
  </div>

  <div class="main-content flex-grow-1 bg-light p-4">
    <router-outlet></router-outlet>
  </div>

</div>
