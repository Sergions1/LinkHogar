<div class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">

      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold">Añadir Gasto</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">Cantidad (€)</label>
          <input type="number" class="form-control form-control-lg fw-bold text-primary" placeholder="0.00"
                 [ngModel]="amount()" (ngModelChange)="amount.set($event)" min="0.01" step="0.01">
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">Categoría</label>
          <select class="form-select" [ngModel]="category()" (ngModelChange)="category.set($event)">
            @for (cat of categories; track cat) {
              <option [value]="cat">{{ cat | expenseCategory }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">
            Descripción
            @if (category() !== 'OTROS') { <span class="fw-normal opacity-50">(Opcional)</span> }
            @else { <span class="text-danger">*</span> }
          </label>
          <input type="text" class="form-control" placeholder="Ej. Compra semanal"
                 [ngModel]="description()" (ngModelChange)="description.set($event)">
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small fw-bold mb-2">¿Quién participa en este gasto?</label>
          <div class="list-group list-group-flush border rounded-3 overflow-hidden">
            @for (member of members; track member.id) {
              <label class="list-group-item d-flex align-items-center gap-3 py-3" style="cursor: pointer;">
                <input class="form-check-input flex-shrink-0 mt-0" type="checkbox"
                       [checked]="selectedMemberIds().has(member.id)"
                       (change)="toggleMember(member.id)">
                <div class="d-flex align-items-center gap-2">
                  <span class="fw-medium">{{ member.name }}</span>
                </div>
              </label>
            }
          </div>
        </div>

      </div>

      <div class="modal-footer border-top-0 pt-0">
        <button type="button" class="btn btn-secondary rounded-pill px-4" (click)="closeModal()" [disabled]="isSubmitting()">Cancelar</button>
        <button type="button" class="btn primary-btn rounded-pill px-4" (click)="submit()" [disabled]="!isValid() || isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Guardando...
          } @else {
            Guardar Gasto
          }
        </button>
      </div>

    </div>
  </div>
</div>
