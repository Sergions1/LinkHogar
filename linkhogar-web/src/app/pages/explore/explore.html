<body>
<div class="p-3 bg-secundario">

  <div class="row my-5">
    <div class="col-12 col-md-6 mx-auto">
      <div class="input-group search-shadow rounded-4 overflow-hidden">
        <span class="input-group-text bg-white border-0 ps-4">
          <i class="bi bi-search text-muted"></i>
        </span>
        <input type="text"
               class="form-control border-0 py-3 shadow-none"
               placeholder="Buscar por municipio..."
               [(ngModel)]="searchTerm"
               (keyup.enter)="onSearch()">
        <button class="btn primary-btn px-4 border-0" (click)="onSearch()">
          Buscar
        </button>
      </div>
    </div>
  </div>

  <div class="d-flex col gap-3">
    <section id="listado" class="w-100 rounded-3">
      <div class="card shadow-sm border-0 rounded-4 bg-segundario h-100 px-4" id="seccionPisos">
        <div class="row g-4 pt-3">
          <app-entity-card-view
            [pageData]="houses()"
            [isLoading]="isLoading()"
            [cardTemplate]="houseCard"
            (pageChange)="onPageChange($event)"
            headerMessage="Hogar encontrado para ti"
            headerMessagePlural="Hogares encontrados para ti">
          </app-entity-card-view>
        </div>
      </div>
    </section>
  </div>
</div>

<ng-template #houseCard let-house>
  <house-card [house]="house" />
</ng-template>
</body>
